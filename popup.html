<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>X 粉丝数量</title></head>
<body>
  <header><span class="logo">𝕏</span><div><h1>粉丝数量</h1><p>在昵称旁，一眼看见。</p></div></header>
  <label class="switch-row">显示粉丝标签<input id="enabled" type="checkbox" checked></label>
  <label class="field" for="mode">显示方式</label>
  <select id="mode"><option value="compact">简洁 · 3.5万 / 7,806</option><option value="exact">完整 · 35,000 / 7,806</option></select>
  <div class="preview">示例昵称 <span id="preview">粉丝 3.5万</span></div>
  <p class="hint">支持首页推文、评论作者，以及粉丝、认证粉丝、关注、搜索等用户列表。安装后请刷新 X 页面。</p>
  <p class="hint">数字来自 X 已加载的数据；未提供数字的账号不显示标签。悬停可查看完整数量。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="diagnostic" class="hint" role="status">正在检查当前标签页…</p>
  <script src="popup.js"></script>
</body>
</html>
